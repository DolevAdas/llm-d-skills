# ---------------------------------------------------------------------------
# Observability + cluster-resource setup
# ---------------------------------------------------------------------------
observability:
  metrics:
    summary: "Prometheus metrics exposed by EPP / model servers / sidecars."
    main: https://llm-d.ai/docs/resources/monitoring/metrics
    secondary: []

  tracing:
    summary: "Distributed tracing setup."
    main: https://llm-d.ai/docs/resources/monitoring/tracing
    secondary: []

cluster_resources:
  rdma:
    summary: "RDMA NIC + RoCE setup for PD KV transfer."
    main: https://llm-d.ai/docs/resources/rdma/rdma-configuration
    secondary:
      - https://github.com/llm-d/llm-d/blob/main/docs/infrastructure/providers/gke/README.md

# ---------------------------------------------------------------------------
# Implementation repos — cite as secondary when guide README lacks detail.
# (Deprecated repos llm-d-deployer / llm-d-model-service / llm-d-routing-sidecar
# are intentionally omitted — see meta.notes above.)
# ---------------------------------------------------------------------------
implementation_repos:
  llm_d_router:
    summary: "Canonical EPP + Router source. Renamed from llm-d-inference-scheduler; now includes the EPP framework plugins, InferenceObjective/InferenceModelRewrite APIs, the pd-sidecar binary, and the routerlib helm chart."
    main: https://github.com/llm-d/llm-d-router/blob/main/README.md
    secondary:
      - https://github.com/llm-d/llm-d-router/blob/main/config/charts/routerlib/values.yaml
      - https://github.com/llm-d/llm-d-router/tree/main/pkg/epp/framework/plugins

  llm_d_kv_cache:
    summary: "Distributed KV cache scheduling + offloading libraries (powers KV indexer/offloader)."
    main: https://github.com/llm-d/llm-d-kv-cache/blob/main/README.md
    secondary: []

  llm_d_latency_predictor:
    summary: "Latency prediction service (the XGBoost sidecar). Talked to by predicted-latency-producer plugin."
    main: https://github.com/llm-d/llm-d-latency-predictor/blob/main/README.md
    secondary: []

  llm_d_workload_variant_autoscaler:
    summary: "WVA implementation."
    main: https://github.com/llm-d/llm-d-workload-variant-autoscaler/blob/main/README.md
    secondary: []

  llm_d_inference_payload_processor:
    summary: "Inference payload processor (request/response transformation)."
    main: https://github.com/llm-d/llm-d-inference-payload-processor/blob/main/README.md
    secondary: []

  llm_d_pd_utils:
    summary: "PD utilities (NIXL image build)."
    main: https://github.com/llm-d/llm-d-pd-utils/blob/main/README.md
    secondary: []

  llm_d_prism:
    summary: "Performance analysis for distributed inference systems."
    main: https://github.com/llm-d/llm-d-prism/blob/main/README.md
    secondary: []

