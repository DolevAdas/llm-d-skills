schemas:
  endpoint_picker_config:
    summary: "EndpointPickerConfig CRD-shaped struct. Authoritative field definitions."
    main: https://github.com/llm-d/llm-d/blob/main/docs/api-reference/endpointpickerconfig.md
    secondary:
      - https://github.com/llm-d/llm-d-router/blob/main/apix/config/v1alpha1/endpointpickerconfig_types.go

  inferencepool_crd:
    summary: "InferencePool CRD spec."
    main: https://github.com/llm-d/llm-d/blob/main/docs/api-reference/inferencepool.md
    secondary: []

  inferenceobjective_crd:
    summary: "InferenceObjective CRD spec (declares per-model SLO targets)."
    main: https://github.com/llm-d/llm-d/blob/main/docs/api-reference/inferenceobjective.md
    secondary: []

  inferencemodelrewrite_crd:
    summary: "InferenceModelRewrite CRD spec (model-name remapping)."
    main: https://github.com/llm-d/llm-d/blob/main/docs/api-reference/inferencemodelrewrite.md
    secondary: []

  epp_http_headers:
    summary: "HTTP headers the EPP recognizes (used by PD routing, request priority, etc.)."
    main: https://github.com/llm-d/llm-d/blob/main/docs/api-reference/epp-http-headers.md
    secondary: []

  glossary:
    summary: "Terminology reference. Disambiguates 'inference pool' vs 'gateway' vs 'EPP' etc."
    main: https://github.com/llm-d/llm-d/blob/main/docs/api-reference/glossary.md
    secondary:
      - https://llm-d.ai/docs/api-reference/glossary

# ---------------------------------------------------------------------------
# Concept docs that complement the guide READMEs ("should I use this feature?"
# vs the guides' "how do I install it?"). docs/well-lit-paths/<name>.md is
# typically what gets rendered at llm-d.ai/docs/guides/<name>.
# ---------------------------------------------------------------------------
concept_docs:
  optimized_baseline_concept:
    summary: "When optimized-baseline is the right choice."
    main: https://github.com/llm-d/llm-d/blob/main/docs/well-lit-paths/capabilities/optimized-baseline.md
    secondary: []

  pd_disaggregation_concept:
    summary: "When PD is the right choice."
    main: https://github.com/llm-d/llm-d/blob/main/docs/well-lit-paths/capabilities/pd-disaggregation.md
    secondary: []

  precise_prefix_cache_aware_concept:
    summary: "When precise prefix cache is the right choice."
    main: https://github.com/llm-d/llm-d/blob/main/docs/well-lit-paths/capabilities/precise-prefix-cache-routing.md
    secondary: []

  predicted_latency_concept:
    summary: "When predicted-latency routing is the right choice."
    main: https://github.com/llm-d/llm-d/blob/main/docs/well-lit-paths/capabilities/predicted-latency.md
    secondary: []

  tiered_prefix_cache_concept:
    summary: "When tiered prefix cache offload is the right choice."
    main: https://github.com/llm-d/llm-d/blob/main/docs/well-lit-paths/capabilities/tiered-prefix-cache.md
    secondary: []

  wide_expert_parallelism_concept:
    summary: "When wide expert parallelism (LWS) is the right choice."
    main: https://github.com/llm-d/llm-d/blob/main/docs/well-lit-paths/capabilities/wide-expert-parallelism.md
    secondary: []

  workload_autoscaling_concept:
    summary: "When to add autoscaling and which option (WVA vs HPA-EPP)."
    main: https://github.com/llm-d/llm-d/blob/main/docs/well-lit-paths/traffic-control/workload-autoscaling.md
    secondary: []

  flow_control_concept:
    summary: "When to enable flow control (admission/queueing/priority)."
    main: https://github.com/llm-d/llm-d/blob/main/docs/well-lit-paths/traffic-control/flow-control.md
    secondary: []

  asynchronous_processing_concept:
    summary: "When async processing is the right choice."
    main: https://github.com/llm-d/llm-d/blob/main/docs/well-lit-paths/workloads/batch-serving/asynchronous-processing.md
    secondary: []

  index:
    summary: "Browse all well-lit-paths concept docs."
    main: https://github.com/llm-d/llm-d/blob/main/docs/well-lit-paths/README.md
    secondary: []

